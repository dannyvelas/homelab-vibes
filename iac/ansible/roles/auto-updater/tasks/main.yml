---
# Deploy the auto-updater systemd timer and update script.

- name: Create run script directory
  ansible.builtin.file:
    path: "{{ run_script_dir }}"
    state: directory
    mode: "0755"

- name: Template update script
  ansible.builtin.template:
    src: update-containers.sh.j2
    dest: "{{ updater_script_path }}"
    mode: "0755"

- name: Template systemd service unit
  ansible.builtin.template:
    src: homelab-updater.service.j2
    dest: /etc/systemd/system/homelab-updater.service
    mode: "0644"
  notify: Reload systemd

- name: Template systemd timer unit
  ansible.builtin.template:
    src: homelab-updater.timer.j2
    dest: /etc/systemd/system/homelab-updater.timer
    mode: "0644"
  notify: Reload systemd

- name: Enable and start auto-updater timer
  ansible.builtin.systemd:
    name: homelab-updater.timer
    enabled: true
    state: started
    daemon_reload: true
