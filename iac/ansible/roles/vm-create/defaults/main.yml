---
# VM creation role defaults

vm_name: homelab-vm-media-01
vm_memory_mb: 5120
vm_vcpus: 2
vm_disk_gb: 40
vm_os_variant: debian12
vm_network_bridge: virbr0
vm_ip: 192.168.122.50

# Cloud-init base image (Debian cloud image)
vm_base_image_url: "https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-generic-amd64.qcow2"
vm_base_image_path: /var/lib/libvirt/images/debian-12-base.qcow2
vm_disk_path: "/var/lib/libvirt/images/{{ vm_name }}.qcow2"

# Cloud-init configuration
vm_cloud_init_user: admin
vm_cloud_init_ssh_key: ""  # Set from homelab.yml secrets.ssh_key_path (public key content)
