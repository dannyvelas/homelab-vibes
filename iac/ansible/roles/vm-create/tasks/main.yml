---
# Create a workload VM via libvirt with cloud-init for initial setup.
# The VM runs on a private NAT subnet and hosts Nomad client + Docker.

- name: Download Debian cloud image (if not present)
  ansible.builtin.get_url:
    url: "{{ vm_base_image_url }}"
    dest: "{{ vm_base_image_path }}"
    mode: "0644"
  register: _base_image

- name: Create VM disk from base image
  ansible.builtin.command:
    cmd: >
      qemu-img create -f qcow2 -F qcow2
      -b {{ vm_base_image_path }}
      {{ vm_disk_path }} {{ vm_disk_gb }}G
    creates: "{{ vm_disk_path }}"

- name: Generate cloud-init user-data
  ansible.builtin.template:
    src: user-data.j2
    dest: "/var/lib/libvirt/images/{{ vm_name }}-user-data.yml"
    mode: "0644"

- name: Generate cloud-init meta-data
  ansible.builtin.template:
    src: meta-data.j2
    dest: "/var/lib/libvirt/images/{{ vm_name }}-meta-data.yml"
    mode: "0644"

- name: Create cloud-init ISO
  ansible.builtin.command:
    cmd: >
      genisoimage -output /var/lib/libvirt/images/{{ vm_name }}-cidata.iso
      -volid cidata -joliet -rock
      /var/lib/libvirt/images/{{ vm_name }}-user-data.yml
      /var/lib/libvirt/images/{{ vm_name }}-meta-data.yml
    creates: "/var/lib/libvirt/images/{{ vm_name }}-cidata.iso"

- name: Check if VM already exists
  ansible.builtin.command:
    cmd: virsh dominfo {{ vm_name }}
  register: _vm_exists
  failed_when: false
  changed_when: false

- name: Create VM with virt-install
  ansible.builtin.command:
    cmd: >
      virt-install
      --name {{ vm_name }}
      --memory {{ vm_memory_mb }}
      --vcpus {{ vm_vcpus }}
      --disk path={{ vm_disk_path }},format=qcow2
      --disk path=/var/lib/libvirt/images/{{ vm_name }}-cidata.iso,device=cdrom
      --os-variant {{ vm_os_variant }}
      --network bridge={{ vm_network_bridge }}
      --graphics none
      --console pty,target_type=serial
      --noautoconsole
      --import
  when: _vm_exists.rc != 0

- name: Wait for VM to be reachable via SSH
  ansible.builtin.wait_for:
    host: "{{ vm_ip }}"
    port: 22
    delay: 10
    timeout: 120
    state: started

- name: Ensure VM is set to autostart
  ansible.builtin.command:
    cmd: virsh autostart {{ vm_name }}
  changed_when: true
