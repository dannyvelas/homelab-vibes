---
# Hardening role defaults

# SSH configuration
hardening_ssh_port: 22
hardening_ssh_permit_root: "no"
hardening_ssh_password_auth: "no"
hardening_ssh_pubkey_auth: "yes"
hardening_ssh_max_auth_tries: 3

# UFW defaults
hardening_ufw_default_incoming: deny
hardening_ufw_default_outgoing: allow

# UFW allowed ports (list of {port, proto, rule} dicts)
hardening_ufw_rules:
  - { port: "{{ hardening_ssh_port }}", proto: tcp, rule: allow, comment: "SSH" }

# Automatic security updates
hardening_auto_updates: true

# Least-privilege user
hardening_admin_user: admin
hardening_admin_groups:
  - sudo
  - libvirt

# NAT/iptables security for VM isolation
# These variables are typically overridden per-host via inventory.
# nat_subnet is set per-host in the generated Ansible inventory.
nat_vm_ip: 192.168.122.50
home_lan_cidr: 192.168.1.0/24

# Ingress port forwarding (host port -> VM port)
nat_ingress_rules:
  - { host_port: 443, vm_port: 443, proto: tcp, comment: "HTTPS to reverse proxy" }

# Egress allowed from VM subnet (everything else is blocked by default forward DROP)
nat_egress_allowed:
  - { port: 80, proto: tcp, comment: "HTTP (media downloads)" }
  - { port: 443, proto: tcp, comment: "HTTPS (media downloads)" }
  - { port: 53, proto: udp, comment: "DNS" }
  - { port: 53, proto: tcp, comment: "DNS over TCP" }
  - { port: 123, proto: udp, comment: "NTP" }
