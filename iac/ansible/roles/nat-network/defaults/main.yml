---
# NAT networking role defaults

# Private NAT subnet for VMs (distinct from home LAN)
nat_subnet: 192.168.122.0/24
nat_gateway_ip: 192.168.122.1
nat_bridge_name: virbr0
nat_dhcp_start: 192.168.122.50
nat_dhcp_end: 192.168.122.200

# Home LAN CIDR (used for egress blocking rules)
home_lan_cidr: 192.168.1.0/24

# VM IP (for port forwarding rules)
nat_vm_ip: 192.168.122.50

# Ingress port forwarding (host port -> VM port)
nat_ingress_rules:
  - { host_port: 443, vm_port: 443, proto: tcp, comment: "HTTPS to reverse proxy" }

# Egress allowed destinations from VM (everything else is blocked)
nat_egress_allowed:
  - { dest: "0.0.0.0/0", port: 80, proto: tcp, comment: "HTTP (media downloads)" }
  - { dest: "0.0.0.0/0", port: 443, proto: tcp, comment: "HTTPS (media downloads)" }
  - { dest: "0.0.0.0/0", port: 53, proto: udp, comment: "DNS" }
  - { dest: "0.0.0.0/0", port: 53, proto: tcp, comment: "DNS over TCP" }
  - { dest: "0.0.0.0/0", port: 123, proto: udp, comment: "NTP" }
