---
# VM guest setup: OS hardening, Docker engine.
# This role runs INSIDE the VM (not on the host).

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

# --- VM OS hardening (subset of host hardening) ---

- name: Install security packages in VM
  ansible.builtin.apt:
    name:
      - ufw
      - unattended-upgrades
    state: present

- name: Configure VM UFW - allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Enable VM UFW
  community.general.ufw:
    state: enabled
    default: deny
    direction: incoming

# --- Docker installation ---

- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present

- name: Add Docker GPG key
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/debian/gpg
    state: present

- name: Add Docker APT repository
  ansible.builtin.apt_repository:
    repo: "deb https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
    state: present

- name: Install Docker Engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present
    update_cache: true

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

# --- Storage mount points ---

- name: Include storage passthrough tasks
  ansible.builtin.include_tasks: storage.yml
