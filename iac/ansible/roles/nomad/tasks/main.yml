---
# Nomad server + client installation and configuration

- name: Install required packages for repository management
  ansible.builtin.apt:
    name:
      - wget
      - gpg
      - software-properties-common
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Add HashiCorp GPG key
  ansible.builtin.apt_key:
    url: https://apt.releases.hashicorp.com/gpg
    state: present

- name: Add HashiCorp APT repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64] https://apt.releases.hashicorp.com {{ ansible_distribution_release }} main"
    state: present
    filename: hashicorp

- name: Update apt cache after adding HashiCorp repository
  ansible.builtin.apt:
    update_cache: true

- name: Install Nomad
  ansible.builtin.apt:
    name: nomad{% if nomad_version != 'latest' %}={{ nomad_version }}{% endif %}
    state: present

- name: Create Nomad data directory
  ansible.builtin.file:
    path: "{{ nomad_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Nomad configuration directory
  ansible.builtin.file:
    path: "{{ nomad_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Template Nomad configuration
  ansible.builtin.template:
    src: nomad.hcl.j2
    dest: "{{ nomad_config_dir }}/nomad.hcl"
    owner: root
    group: root
    mode: "0644"
  notify: Restart nomad

- name: Enable and start Nomad service
  ansible.builtin.systemd:
    name: "{{ nomad_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
