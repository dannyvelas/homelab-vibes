---
# Host-level setup: OS hardening and hypervisor installation.
# Runs BEFORE Terraform (which needs KVM/libvirt to be installed).
#
# Usage (invoked by `iac provision host`):
#   ansible-playbook -i .generated/ansible/inventory/hosts.yml \
#     iac/ansible/playbooks/setup-host.yml \
#     --limit <host_name>

- name: Setup physical host
  hosts: hosts
  become: true
  gather_facts: true

  roles:
    - hardening-common
    - hardening-host
    - hypervisor
