---
# VM guest configuration: OS hardening, Docker installation, and storage setup.
# Runs AFTER Terraform has created the VM.
#
# Usage (invoked by `iac provision host`):
#   ansible-playbook -i .generated/ansible/inventory/hosts.yml \
#     iac/ansible/playbooks/configure-vm.yml \
#     --limit <host_name>-vm

- name: Configure workload VM
  hosts: vms
  become: true
  gather_facts: true

  roles:
    - hardening-common
    - vm-guest
